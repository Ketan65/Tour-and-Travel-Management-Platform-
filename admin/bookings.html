<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Bookings | Wanderly Admin</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/admin.css" />
  </head>
  <body class="admin" data-page="admin-bookings" data-root="../" data-auth="admin">
    <header class="site-header admin-bar"><div class="container"><a href="../index.html" class="brand-logo">Wanderly<span class="admin-tag">ADMIN</span></a>
      <nav class="main-nav"><ul><li><a href="../index.html">View Site</a></li><li><a href="#" id="admin-logout">Logout</a></li></ul></nav></div></header>
    <div class="admin-wrap">
      <aside class="admin-side"><a href="dashboard.html">Overview</a><a href="bookings.html" class="active">Bookings</a><a href="packages.html">Packages</a><a href="destinations.html">Destinations</a><a href="users.html">Users</a><a href="enquiries.html">Enquiries & Messages</a><hr /><a href="../index.html">&larr; Back to website</a></aside>
      <section class="admin-main">
        <h1>Booking management</h1><p class="admin-sub">Approve or cancel requests made by users.</p>
        <div class="panel"><div class="toolbar">
          <input class="grow" id="b-q" type="search" placeholder="Search ID, customer, email, package…" />
          <select id="b-status"><option value="">All statuses</option><option>Pending</option><option>Approved</option><option>Cancelled</option></select>
          <select id="b-pkg"></select>
          <select id="b-sort"><option value="new">Newest first</option><option value="travel">Travel date</option><option value="amount">Highest amount</option></select>
          <button class="btn btn-secondary" id="b-csv" type="button">Export CSV</button></div>
          <p class="result-count" id="b-count"></p>
          <div class="table-wrap"><table class="data-table"><thead><tr><th>ID</th><th>Customer</th><th>Package</th><th>Travel</th><th>Pax</th><th>Total</th><th>Status</th><th>Actions</th></tr></thead><tbody id="b-body"></tbody></table></div>
          <div class="pager" id="b-pager"></div></div>
      </section>
    </div>
    <script src="../js/data.js"></script>
    <script src="../js/common.js"></script>
    <script src="../js/admin-bookings.js"></script>
  </body>
</html>
