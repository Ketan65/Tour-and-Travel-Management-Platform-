name: Frontend CI & Integrity Checks

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  validate:
    name: Code & Structure Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify Core File Structure
        run: |
          echo "Verifying Tour & Travel Frontend project files..."
          test -f index.html || (echo "Missing index.html" && exit 1)
          test -f pages/auth.html || (echo "Missing pages/auth.html" && exit 1)
          test -f pages/dashboard.html || (echo "Missing pages/dashboard.html" && exit 1)
          test -f pages/tours.html || (echo "Missing pages/tours.html" && exit 1)
          test -f pages/tour-details.html || (echo "Missing pages/tour-details.html" && exit 1)
          test -f assets/js/data/tours-data.js || (echo "Missing tours-data.js" && exit 1)
          echo "All core files exist and validated!"

      - name: Check for Accidentally Committed Secrets
        run: |
          echo "Scanning for forbidden .env or private key files..."
          if find . -name "*.env" -o -name "*.key" -o -name "*.pem" | grep -v "node_modules" | grep .; then
            echo "Error: Found secret files in repository. Please remove them!"
            exit 1
          fi
          echo "Security scan clean!"
