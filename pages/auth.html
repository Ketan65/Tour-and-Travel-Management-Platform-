<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WanderWave — Account Access & Authentication</title>
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/modules/auth.css">
</head>
<body class="auth-body">
  <header class="navbar">
    <div class="container nav-container">
      <a href="../index.html" class="brand-logo"><div class="logo-icon">✈</div>Wander<span>Wave</span></a>
      <a href="../index.html" class="btn btn-outline btn-sm">&larr; Back to Home</a>
    </div>
  </header>

  <main class="auth-container">
    <div class="auth-card">
      <div class="auth-tabs">
        <button class="auth-tab active" id="loginTabBtn" onclick="switchAuthTab('login')">Sign In</button>
        <button class="auth-tab" id="registerTabBtn" onclick="switchAuthTab('register')">Create Account</button>
      </div>

      <!-- Login Form (Member 1: feature/auth) -->
      <form id="loginForm" class="auth-form" onsubmit="handleLogin(event)">
        <h2>Welcome Back</h2>
        <p class="text-muted">Enter your credentials to access your bookings.</p>
        <div class="form-group" style="margin-top: 1.5rem;">
          <label class="form-label">Email Address</label>
          <input type="email" class="form-control" id="loginEmail" required placeholder="you@example.com">
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" class="form-control" id="loginPassword" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg">Sign In to WanderWave</button>
      </form>

      <!-- Register Form (Member 1: feature/auth) -->
      <form id="registerForm" class="auth-form" style="display: none;" onsubmit="handleRegister(event)">
        <h2>Join WanderWave</h2>
        <p class="text-muted">Start your journey across 48+ worldwide destinations.</p>
        <div class="form-group" style="margin-top: 1.5rem;">
          <label class="form-label">Full Name</label>
          <input type="text" class="form-control" id="regName" required placeholder="John Doe">
        </div>
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" class="form-control" id="regEmail" required placeholder="you@example.com">
        </div>
        <div class="form-group">
          <label class="form-label">Create Password</label>
          <input type="password" class="form-control" id="regPassword" required placeholder="At least 6 characters">
        </div>
        <button type="submit" class="btn btn-primary btn-block btn-lg">Create Account</button>
      </form>
    </div>
  </main>

  <div id="toastContainer" class="toast-container"></div>
  <script src="../assets/js/data/tours-data.js"></script>
  <script src="../assets/js/modules/auth.js"></script>
</body>
</html>
