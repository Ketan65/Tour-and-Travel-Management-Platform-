<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WanderWave — Tour Packages Catalog</title>
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/modules/tours.css">
</head>
<body>
  <header class="navbar">
    <div class="container nav-container">
      <a href="../index.html" class="brand-logo"><div class="logo-icon">✈</div>Wander<span>Wave</span></a>
      <nav class="nav-links">
        <a href="../index.html" class="nav-link">Home</a>
        <a href="tours.html" class="nav-link active">Tours & Packages</a>
        <a href="dashboard.html" class="nav-link">Dashboard</a>
      </nav>
      <div class="nav-actions">
        <a href="auth.html" class="btn btn-outline btn-sm">Sign In</a>
      </div>
    </div>
  </header>

  <main class="container section">
    <div class="tours-layout">
      <!-- Filter Sidebar (Member 3: feature/product) -->
      <aside class="filter-sidebar">
        <h3>Filter Tours</h3>
        <div class="form-group" style="margin-top: 1rem;">
          <label class="form-label">Search</label>
          <input type="text" class="form-control" id="tourSearchInput" placeholder="Search destination..." oninput="filterTours()">
        </div>
        <div class="form-group">
          <label class="form-label">Category</label>
          <select class="form-select" id="tourCategoryFilter" onchange="filterTours()">
            <option value="all">All Categories</option>
            <option value="Beach">Beach & Tropical</option>
            <option value="Mountain">Mountain & Trekking</option>
            <option value="Cultural">Cultural Heritage</option>
            <option value="Honeymoon">Romantic & Honeymoon</option>
            <option value="Adventure">Wild Safari</option>
          </select>
        </div>
      </aside>

      <!-- Tours Grid (Member 3: feature/product) -->
      <section>
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
          <h2>Available Tour Packages</h2>
          <span class="text-muted" id="toursCountText">Showing packages</span>
        </div>
        <div id="toursGrid" class="grid grid-2"></div>
      </section>
    </div>
  </main>

  <script src="../assets/js/data/tours-data.js"></script>
  <script src="../assets/js/modules/tours.js"></script>
</body>
</html>
