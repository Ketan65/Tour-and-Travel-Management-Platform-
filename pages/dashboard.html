<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WanderWave — Traveler Dashboard & Bookings</title>
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/modules/dashboard.css">
</head>
<body>
  <header class="navbar">
    <div class="container nav-container">
      <a href="../index.html" class="brand-logo"><div class="logo-icon">✈</div>Wander<span>Wave</span></a>
      <nav class="nav-links">
        <a href="../index.html" class="nav-link">Home</a>
        <a href="tours.html" class="nav-link">Tours & Packages</a>
        <a href="dashboard.html" class="nav-link active">Dashboard</a>
      </nav>
      <div class="nav-actions">
        <a href="tours.html" class="btn btn-primary btn-sm">Book New Tour</a>
      </div>
    </div>
  </header>

  <main class="container section">
    <div class="dashboard-grid">
      <!-- Profile Sidebar (Member 2: feature/user) -->
      <aside class="profile-card">
        <div class="profile-avatar-wrapper">
          <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=200&q=80" id="profileAvatar" alt="Profile Avatar">
        </div>
        <h3 id="profileName">Ketan Verma</h3>
        <p class="text-muted" id="profileEmail">ketan.verma@example.com</p>
        <span class="badge badge-primary" style="margin: 0.75rem auto; display: inline-block;" id="profileTier">Elite Explorer</span>

        <hr style="border: none; border-top: 1px solid var(--color-border); margin: 1.5rem 0;">
        <ul class="dash-nav">
          <li><a href="#" class="active">📋 My Bookings</a></li>
          <li><a href="#">❤️ Saved Tours</a></li>
          <li><a href="#">⚙️ Profile Settings</a></li>
        </ul>
      </aside>

      <!-- Bookings Content Panel (Member 2: feature/user) -->
      <section class="bookings-panel">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
          <h2>My Tour Bookings</h2>
          <span class="badge badge-secondary" id="bookingCountBadge">2 Active</span>
        </div>

        <div id="bookingsList" class="bookings-list"></div>
      </section>
    </div>
  </main>

  <div id="toastContainer" class="toast-container"></div>
  <script src="../assets/js/data/tours-data.js"></script>
  <script src="../assets/js/modules/dashboard.js"></script>
</body>
</html>
