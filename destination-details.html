<div class="detail-hero"><img src="https://images.unsplash.com/photo-1599661046289-e31897846e41?auto=format&fit=crop&w=1200&q=85" alt="Jaipur"><div class="detail-copy"><div class="breadcrumb"><a href="destinations.html">Destinations</a> / Jaipur</div><h2>Jaipur</h2><p>Heritage capital with forts, palaces and colourful markets.</p><div class="info-grid"><div class="info-item"><strong>Suggested stay</strong><span>3–4 days</span></div><div class="info-item"><strong>Best for</strong><span>Culture, history, architecture</span></div><div class="info-item"><strong>Travel style</strong><span>Flexible itinerary</span></div></div><div class="button-row"><a class="btn" href="packages.html">Find a Package</a><a class="btn btn-secondary" href="booking.html">Plan / Book</a></div></div></div>
<div class="split section"><div class="content-box"><h3>About Jaipur</h3><p>Jaipur works well for a short cultural trip. Spend your mornings around major forts and palaces, keep the afternoons for museums and old-city lanes, and leave an evening for local food and markets.</p></div><div class="content-box"><h3>Places to include</h3><ul class="clean-list"><li>Hawa Mahal</li><li>Amer Fort</li><li>City Palace</li><li>Jantar Mantar</li></ul></div></div>
<div class="note-box"><strong>Local tip:</strong> Give yourself at least one full day inside the forts before rushing on to the next city — Jaipur rewards travellers who slow down.</div></section><section class="detail-section" id="goa">
<div class="detail-hero"><img src="https://images.unsplash.com/photo-1512343879784-a960bf40e7f2?auto=format&fit=crop&w=1200&q=85" alt="Goa"><div class="detail-copy"><div class="breadcrumb"><a href="destinations.html">Destinations</a> / Goa</div><h2>Goa</h2><p>A flexible coastal trip with beaches, old-town character and relaxed evenings.</p><div class="info-grid"><div class="info-item"><strong>Suggested stay</strong><span>4–5 days</span></div><div class="info-item"><strong>Best for</strong><span>Beach, food, leisure</span></div><div class="info-item"><strong>Travel style</strong><span>Flexible itinerary</span></div></div><div class="button-row"><a class="btn" href="packages.html">Find a Package</a><a class="btn btn-secondary" href="booking.html">Plan / Book</a></div></div></div>
<div class="split section"><div class="content-box"><h3>About Goa</h3><p>Goa can be planned around either busy beach areas or quieter southern stretches. A good plan balances beach time with Panjim and heritage stops.</p></div><div class="content-box"><h3>Places to include</h3><ul class="clean-list"><li>Baga Beach</li><li>Panjim</li><li>Fort Aguada</li><li>South Goa beaches</li></ul></div></div>
<div class="note-box"><strong>Local tip:</strong> North Goa gets busy in peak season, so if you want quiet beaches, plan a couple of days further south.</div></section><section class="detail-section" id="manali">
<div class="detail-hero"><img src="https://images.unsplash.com/photo-1626621341517-bbf3d9990a23?auto=format&fit=crop&w=1200&q=85" alt="Manali"><div class="detail-copy"><div class="breadcrumb"><a href="destinations.html">Destinations</a> / Manali</div><h2>Manali</h2><p>Mountain scenery, valley drives and cool-weather escapes.</p><div class="info-grid"><div class="info-item"><strong>Suggested stay</strong><span>5–6 days</span></div><div class="info-item"><strong>Best for</strong><span>Mountains, nature, photography</span></div><div class="info-item"><strong>Travel style</strong><span>Flexible itinerary</span></div></div><div class="button-row"><a class="btn" href="packages.html">Find a Package</a><a class="btn btn-secondary" href="booking.html">Plan / Book</a></div></div></div>
<div class="split section"><div class="content-box"><h3>About Manali</h3><p>Manali is best enjoyed without overpacking the itinerary. Keep a full day for the valley and local areas, then use remaining days for scenic excursions and flexible outdoor time.</p></div><div class="content-box"><h3>Places to include</h3><ul class="clean-list"><li>Solang Valley</li><li>Old Manali</li><li>Hidimba area</li><li>Mountain viewpoints</li></ul></div></div>
<div class="note-box"><strong>Local tip:</strong> Roads to the higher valleys can close briefly after fresh snow, so keep a spare day in hand during winter.</div></section><section class="detail-section" id="kerala">
<div class="detail-hero"><img src="https://images.unsplash.com/photo-1602216056096-3b40cc0c9944?auto=format&fit=crop&w=1200&q=85" alt="Kerala"><div class="detail-copy"><div class="breadcrumb"><a href="destinations.html">Destinations</a> / Kerala</div><h2>Kerala</h2><p>A slower journey through backwaters, hills and tropical landscapes.</p><div class="info-grid"><div class="info-item"><strong>Suggested stay</strong><span>5–6 days</span></div><div class="info-item"><strong>Best for</strong><span>Nature, wellness, slow travel</span></div><div class="info-item"><strong>Travel style</strong><span>Flexible itinerary</span></div></div><div class="button-row"><a class="btn" href="packages.html">Find a Package</a><a class="btn btn-secondary" href="booking.html">Plan / Book</a></div></div></div>
<div class="split section"><div class="content-box"><h3>About Kerala</h3><p>Kerala suits travellers who want several landscape types in one trip. Combine a hill stop with a backwater stay and a city or heritage segment.</p></div><div class="content-box"><h3>Places to include</h3><ul class="clean-list"><li>Alappuzha</li><li>Munnar</li><li>Kochi</li><li>Kumarakom</li></ul></div></div>
<div class="note-box"><strong>Local tip:</strong> Book houseboats a few weeks ahead in peak season (November to February) — the good ones fill up fast.</div></section><section class="detail-section" id="kashmir">
<div class="detail-hero"><img src="https://images.unsplash.com/photo-1595815771614-ade9d652a65d?auto=format&fit=crop&w=1200&q=85" alt="Kashmir"><div class="detail-copy"><div class="breadcrumb"><a href="destinations.html">Destinations</a> / Kashmir</div><h2>Kashmir</h2><p>A scenic valley experience built around lakes, meadows and mountain views.</p><div class="info-grid"><div class="info-item"><strong>Suggested stay</strong><span>5–7 days</span></div><div class="info-item"><strong>Best for</strong><span>Scenery, leisure, photography</span></div><div class="info-item"><strong>Travel style</strong><span>Flexible itinerary</span></div></div><div class="button-row"><a class="btn" href="packages.html">Find a Package</a><a class="btn btn-secondary" href="booking.html">Plan / Book</a></div></div></div>
<div class="split section"><div class="content-box"><h3>About Kashmir</h3><p>Kashmir trips are strongest when the itinerary leaves room for scenery rather than only ticking attractions off a list. Choose one base for a relaxed pace and day trips around it.</p></div><div class="content-box"><h3>Places to include</h3><ul class="clean-list"><li>Dal Lake</li><li>Gulmarg</li><li>Pahalgam</li><li>Srinagar old city</li></ul></div></div>
<div class="note-box"><strong>Local tip:</strong> Pahalgam and Gulmarg are each worth a full day trip from Srinagar rather than a rushed half-day stop.</div></section><section class="detail-section" id="rajasthan">
<div class="detail-hero"><img src="https://images.unsplash.com/photo-1477587458883-47145ed94245?auto=format&fit=crop&w=1200&q=85" alt="Rajasthan"><div class="detail-copy"><div class="breadcrumb"><a href="destinations.html">Destinations</a> / Rajasthan</div><h2>Rajasthan</h2><p>A heritage circuit through royal cities, forts and old markets.</p><div class="info-grid"><div class="info-item"><strong>Suggested stay</strong><span>6–8 days</span></div><div class="info-item"><strong>Best for</strong><span>History, architecture, culture</span></div><div class="info-item"><strong>Travel style</strong><span>Flexible itinerary</span></div></div><div class="button-row"><a class="btn" href="packages.html">Find a Package</a><a class="btn btn-secondary" href="booking.html">Plan / Book</a></div></div></div>
<div class="split section"><div class="content-box"><h3>About Rajasthan</h3><p>Rajasthan works especially well as a multi-city road itinerary. Keep transfer days realistic, then leave enough time in each city to explore beyond one landmark.</p></div><div class="content-box"><h3>Places to include</h3><ul class="clean-list"><li>Jaipur</li><li>Jodhpur</li><li>Udaipur</li><li>Local bazaars</li></ul></div></div>
<div class="note-box"><strong>Local tip:</strong> Trains and cabs between cities take longer than they look on a map — build in real travel time, not just distance.</div></section><section class="detail-section" id="agra">
<div class="detail-hero"><img src="https://images.unsplash.com/photo-1564507592333-c60657eea523?auto=format&fit=crop&w=1200&q=85" alt="Agra"><div class="detail-copy"><div class="breadcrumb"><a href="destinations.html">Destinations</a> / Agra</div><h2>Agra</h2><p>A focused heritage stop built around major Mughal-era landmarks.</p><div class="info-grid"><div class="info-item"><strong>Suggested stay</strong><span>1–2 days</span></div><div class="info-item"><strong>Best for</strong><span>Monuments, photography</span></div><div class="info-item"><strong>Travel style</strong><span>Flexible itinerary</span></div></div><div class="button-row"><a class="btn" href="packages.html">Find a Package</a><a class="btn btn-secondary" href="booking.html">Plan / Book</a></div></div></div>
<div class="split section"><div class="content-box"><h3>About Agra</h3><p>Agra can be handled as a compact stop with one full day. Start early for the Taj Mahal and keep the rest of the day for nearby heritage sights.</p></div><div class="content-box"><h3>Places to include</h3><ul class="clean-list"><li>Taj Mahal</li><li>Agra Fort</li><li>Mehtab Bagh</li></ul></div></div>
<div class="note-box"><strong>Local tip:</strong> Arrive at the Taj Mahal at sunrise; it's far quieter and the light is better than any other time of day.</div></section><section class="detail-section" id="udaipur">
<div class="detail-hero"><img src="https://images.unsplash.com/photo-1589901164570-f9de6556e1c1?auto=format&fit=crop&w=1200&q=85" alt="Udaipur"><div class="detail-copy"><div class="breadcrumb"><a href="destinations.html">Destinations</a> / Udaipur</div><h2>Udaipur</h2><p>Lakeside views, palace architecture and relaxed city evenings.</p><div class="info-grid"><div class="info-item"><strong>Suggested stay</strong><span>2–3 days</span></div><div class="info-item"><strong>Best for</strong><span>Leisure, heritage, couples</span></div><div class="info-item"><strong>Travel style</strong><span>Flexible itinerary</span></div></div><div class="button-row"><a class="btn" href="packages.html">Find a Package</a><a class="btn btn-secondary" href="booking.html">Plan / Book</a></div></div></div>
<div class="split section"><div class="content-box"><h3>About Udaipur</h3><p>Udaipur is suited to a slower two- or three-day break. Mix palace visits with time near the lakes and old-city streets.</p></div><div class="content-box"><h3>Places to include</h3><ul class="clean-list"><li>City Palace</li><li>Lake Pichola</li><li>Jagdish Temple</li><li>Old City</li></ul></div></div>
<div class="note-box"><strong>Local tip:</strong> Book a lake-facing table for dinner at least a day ahead — the good spots overlooking Lake Pichola fill up quickly.</div></section></main><footer class="site-footer"><div class="container"><div class="footer-grid">
